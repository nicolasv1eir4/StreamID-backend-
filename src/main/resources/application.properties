
# Nome da Aplica\u00e7\u00e3o
spring.application.name=streamid

# Define cores no terminal
spring.output.ansi.enabled=always

# Define path raiz do endpoint
# http://localhost:8080/raiz_do_endpoint/algumacoisa
server.servlet.context-path=/streamid

spring.profiles.active=${APP_ENVIRONMENT:test}
#spring.profiles.active=test
#spring.profiles.active=prod

# Defini\u00e7\u00e3o de Porta
# Procura uma variavel de ambiente SERVER_PORT. Caso n\u00e3o exista utiliza
# a porta 8080 como default.
server.port=${SERVER_PORT:8080}


# Upload de m\u00eddias
spring.servlet.multipart.max-file-size=200MB
spring.servlet.multipart.max-request-size=200MB
app.upload-dir=${UPLOAD_DIR:uploads}