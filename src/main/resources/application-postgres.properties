
# ===================================================================
# CONFIGURA\u00c7\u00c3O DA BASE DE DADOS (PostgreSQL / Vercel-Neon)
# ===================================================================

# Leitura din\u00e2mica das vari\u00e1veis de ambiente com fallback para testes
spring.datasource.url=jdbc:${POSTGRES_URL:localhost:8080}?channel_binding=require&sslmode=require
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}

spring.jpa.properties.hibernate.default_schema=public

# Driver e Dialeto ajustados para PostgreSQL
spring.datasource.driverClassName=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Otimiza\u00e7\u00e3o do Pool de Conex\u00f5es (HikariCP) para a inst\u00e2ncia Free do Render
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=600000

# ===================================================================
# CONFIGURA\u00c7\u00d5ES DO HIBERNATE / JPA
# ===================================================================

# DDL Auto: em produ\u00e7\u00e3o costuma-se usar 'update' ou 'validate' (ou 'none' se usar migrations)
spring.jpa.hibernate.ddl-auto=update

# Exibicao de SQL (desativado para economizar logs em producao)
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.show_sql=false
