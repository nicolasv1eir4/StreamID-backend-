# Configura\u00e7\u00e3o de Base de Dados
# Configura\u00e7\u00e3o de Base de Dados
spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:3306/${MYSQL_DB:kge_estoque}?createDatabaseIfNotExist=true&serverTimezone=UTC
spring.datasource.username=${MYSQL_USER:kge}
spring.datasource.password=${MYSQL_PASS:kgepassword}
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver

# Habilita cria\u00e7\u00e3o de tabelas e import.sql
# import.sql is a Hibernate feature and will only be executed if 
# spring.jpa.hibernate.ddl-auto (or the underlying Hibernate hibernate.hbm2ddl.auto) 
# is set to create or create-drop. If it's set to update, 
# validate, or none, import.sql will not be run.
spring.jpa.hibernate.ddl-auto=create

spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:import.sql

# MONGODB (MongoProperties)
#spring.data.mongodb.uri=mongodb://172.16.0.30:27017/REDSappDB

# Show SQL
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.show_sql=false
